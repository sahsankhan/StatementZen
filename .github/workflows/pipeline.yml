name: Cypress Feature Tests

on:
  push:
    branches:
      - mcp
  pull_request:
    branches:
      - mcp

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Replace with your Node version

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Ensure Cypress binary is installed
      - name: Install Cypress
        run: npm install cypress --save-dev

      # 5. Run Cypress feature tests
      - name: Run Cypress tests
        env:
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
        run: npx cypress run --spec "cypress/e2e/features/**/*.feature"

      # Optional: Upload Cypress artifacts on failure
      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
